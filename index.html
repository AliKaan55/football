      (function() {
        // 1. Intercept and suppress any "Cannot set property fetch of #<Window> which has only a getter"
        function isFetchGetterError(e) {
          try {
            var msg = (e && (e.message || e.reason || (e.error && e.error.message))) || String(e || '');
            return msg.indexOf('fetch') !== -1 && (msg.indexOf('getter') !== -1 || msg.indexOf('read only') !== -1 || msg.indexOf('Cannot set property') !== -1);
          } catch(err) {
            return false;
          }
        }

        window.addEventListener('error', function(event) {
          if (isFetchGetterError(event)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isFetchGetterError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg) {
          if (msg && String(msg).indexOf('fetch') !== -1 && String(msg).indexOf('getter') !== -1) {
            return true;
          }
          if (prevOnError) {
            return prevOnError.apply(this, arguments);
          }
        };

        // 2. Make window.fetch writable and configurable
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : function() { return Promise.reject(new Error('fetch not supported')); };
          var activeFetch = nativeFetch;

          // A. Define own property directly on window with getter and setter
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch(e) {
            try {
              Object.defineProperty(window, 'fetch', {
                value: activeFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch(e2) {}
          }

          // B. Also define on Window.prototype if present
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch(e3) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  value: activeFetch,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              } catch(e4) {}
            }
          }

          // C. Also define on globalThis
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch(e5) {}
          }
        } catch(err) {}
      })();
